<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖表快速查詢</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f6f8;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.3rem;
        }
        .input-group {
            margin: 15px 0;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #007aff;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .img-container {
            margin-top: 20px;
            display: none;
        }
        .img-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .error-msg {
            color: #d9534f;
            margin-top: 15px;
            display: none;
            font-size: 0.95rem;
        }
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #34c759;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>圖表快速查詢</h2>
    <div class="input-group">
        <input type="text" id="searchInput" placeholder="請輸入公司代碼或公司名稱 (例: 台積電 或 2330)">
    </div>
    <button onclick="searchPhoto()">查看圖表</button>

    <div class="error-msg" id="errorMsg"></div>

    <!-- 圖片顯示區 -->
    <div class="img-container" id="imgContainer">
        <img id="resultImg" src="" alt="載入中..." onerror="handleImageError()">
        <br>
        <a id="downloadBtn" href="" download class="download-btn">下載此圖表</a>
    </div>
</div>

<script>
    let companyMap = {};

    // 網頁載入時，自動讀取同資料夾下的 companies.json
    fetch('./companies.json')
        .then(response => response.json())
        .then(data => {
            companyMap = data;
            console.log("對照表已順利載入，共包含", Object.keys(companyMap).length, "筆資料");
        })
        .catch(err => {
            console.error("對照表載入失敗:", err);
        });

    function searchPhoto() {
        const rawInput = document.getElementById("searchInput").value.trim();
        const errorMsg = document.getElementById("errorMsg");
        const imgContainer = document.getElementById("imgContainer");
        const resultImg = document.getElementById("resultImg");
        const downloadBtn = document.getElementById("downloadBtn");

        if (!rawInput) {
            errorMsg.innerText = "請輸入搜尋內容！";
            errorMsg.style.display = "block";
            imgContainer.style.display = "none";
            return;
        }

        let targetCode = "";

        // 去除使用者可能輸入的 .TW 或 .TWO 後綴字
        let cleanInput = rawInput.replace(/\.(TW|TWO)$/i, '');

        // 判斷 1：如果輸入的是數字 (1~4 位數)
        if (/^\d{1,4}$/.test(cleanInput)) {
            targetCode = cleanInput.padStart(4, '0');
        } 
        // 判斷 2：如果輸入的是公司名稱
        else {
            // 模糊搜尋（只要公司名稱包含關鍵字，例如輸入「台積」也能對應到「台積電」）
            const matchedKey = Object.keys(companyMap).find(key => 
                key.toLowerCase().includes(rawInput.toLowerCase()) || 
                rawInput.toLowerCase().includes(key.toLowerCase())
            );

            if (matchedKey) {
                targetCode = companyMap[matchedKey];
            } else {
                errorMsg.innerText = `找不到與「${rawInput}」相關的公司名稱！`;
                errorMsg.style.display = "block";
                imgContainer.style.display = "none";
                return;
            }
        }

        errorMsg.style.display = "none";
        
        const imgUrl = `./${targetCode}.png`;

        resultImg.src = imgUrl;
        imgContainer.style.display = "block";

        downloadBtn.href = imgUrl;
        downloadBtn.download = `${targetCode}.png`;
    }

    function handleImageError() {
        const errorMsg = document.getElementById("errorMsg");
        const imgContainer = document.getElementById("imgContainer");
        
        imgContainer.style.display = "none";
        errorMsg.innerText = "找不到對應的圖表檔案（請確認 PNG 是否存在）！";
        errorMsg.style.display = "block";
    }

    document.getElementById("searchInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            searchPhoto();
        }
    });
</script>

</body>
</html>
