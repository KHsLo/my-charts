<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖表快速查詢</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f6f8;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.3rem;
        }
        .input-group {
            margin: 15px 0;
        }
        /* 設定 type="text"，確保手機端能順利切換中文與數字輸入法 */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #007aff;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .img-container {
            margin-top: 20px;
            display: none;
        }
        .img-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .error-msg {
            color: #d9534f;
            margin-top: 15px;
            display: none;
            font-size: 0.95rem;
        }
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #34c759;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .download-btn:hover {
            background-color: #28a745;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>圖表快速查詢</h2>
    <div class="input-group">
        <!-- 輸入框為 type="text"，不加 numeric 限制，讓手機彈出完整輸入法 -->
        <input type="text" id="searchInput" placeholder="請輸入公司代碼或名稱 (例: 台積電 或 2330)" autocomplete="off">
    </div>
    <button onclick="searchPhoto()">查看圖表</button>

    <div class="error-msg" id="errorMsg"></div>

    <!-- 圖片顯示區 -->
    <div class="img-container" id="imgContainer">
        <img id="resultImg" src="" alt="圖表載入中..." onerror="handleImageError()">
        <br>
        <a id="downloadBtn" href="" download class="download-btn">下載此圖表</a>
    </div>
</div>

<script>
    let companyMap = {};

    // 頁面載入時，自動抓取對應的 companies.json 對照表
    fetch('./companies.json')
        .then(response => {
            if (!response.ok) {
                throw new Error("無法讀取 companies.json 檔案");
            }
            return response.json();
        })
        .then(data => {
            companyMap = data;
            console.log("對照表已載入，共計 " + Object.keys(companyMap).length + " 筆公司資料");
        })
        .catch(err => {
            console.warn("對照表載入提示:", err.message);
        });

    function searchPhoto() {
        const rawInput = document.getElementById("searchInput").value.trim();
        const errorMsg = document.getElementById("errorMsg");
        const imgContainer = document.getElementById("imgContainer");
        const resultImg = document.getElementById("resultImg");
        const downloadBtn = document.getElementById("downloadBtn");

        if (!rawInput) {
            errorMsg.innerText = "請輸入搜尋內容！";
            errorMsg.style.display = "block";
            imgContainer.style.display = "none";
            return;
        }

        let targetCode = "";

        // 自動去除非數字的後綴字（如 .TW 或 .TWO）
        let cleanInput = rawInput.replace(/\.(TW|TWO)$/i, '');

        // 判斷 1：如果輸入的是純數字 (1 ~ 4 位數)
        if (/^\d{1,4}$/.test(cleanInput)) {
            targetCode = cleanInput.padStart(4, '0');
        } 
        // 判斷 2：如果輸入的是中文/英文公司名稱
        else {
            // 進行模糊比對搜尋 (包含關鍵字即可)
            const matchedKey = Object.keys(companyMap).find(key => 
                key.toLowerCase().includes(rawInput.toLowerCase()) || 
                rawInput.toLowerCase().includes(key.toLowerCase())
            );

            if (matchedKey) {
                targetCode = companyMap[matchedKey];
            } else {
                errorMsg.innerText = `找不到與「${rawInput}」相關的公司名稱！`;
                errorMsg.style.display = "block";
                imgContainer.style.display = "none";
                return;
            }
        }

        errorMsg.style.display = "none";
        
        // 取得相對路徑的 PNG 圖檔
        const imgUrl = `./${targetCode}.png`;

        resultImg.src = imgUrl;
        imgContainer.style.display = "block";

        // 設定下載按鈕連結與預設下載檔名
        downloadBtn.href = imgUrl;
        downloadBtn.download = `${targetCode}.png`;
    }

    // 圖片載入失敗時的處理
    function handleImageError() {
        const errorMsg = document.getElementById("errorMsg");
        const imgContainer = document.getElementById("imgContainer");
        
        imgContainer.style.display = "none";
        errorMsg.innerText = "找不到對應的圖表檔案（請確認是否有該代碼的 PNG 圖檔）！";
        errorMsg.style.display = "block";
    }

    // 支援按下鍵盤 Enter 鍵直接進行查詢
    document.getElementById("searchInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            searchPhoto();
        }
    });
</script>

</body>
</html>
