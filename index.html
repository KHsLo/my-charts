<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖表快速查詢</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f6f8;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.3rem;
        }
        .input-group {
            margin: 15px 0;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #007aff;
        }
        button.search-btn {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button.search-btn:hover {
            background-color: #0056b3;
        }
        /* 多家公司符合時的點擊候選選單樣式 */
        .candidate-list {
            margin-top: 15px;
            display: none;
            text-align: left;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 12px;
        }
        .candidate-title {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
        }
        .candidate-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            margin-bottom: 8px;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .candidate-item:last-child {
            margin-bottom: 0;
        }
        .candidate-item:hover, .candidate-item:active {
            background-color: #e7f3ff;
            border-color: #007aff;
        }
        .candidate-name {
            font-weight: bold;
            color: #333;
        }
        .candidate-code {
            font-size: 0.85rem;
            color: #007aff;
            background: #e7f3ff;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
        }
        .img-container {
            margin-top: 20px;
            display: none;
        }
        .img-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .error-msg {
            color: #d9534f;
            margin-top: 15px;
            display: none;
            font-size: 0.95rem;
        }
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #34c759;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .download-btn:hover {
            background-color: #28a745;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>圖表快速查詢</h2>
    <div class="input-group">
        <input type="text" id="searchInput" placeholder="請輸入公司代碼或名稱 (例: 鮮活 或 2330)" autocomplete="off">
    </div>
    <button class="search-btn" onclick="searchPhoto()">查看圖表</button>

    <div class="error-msg" id="errorMsg"></div>

    <!-- 多家公司符合時顯示的點擊選單區 -->
    <div class="candidate-list" id="candidateList">
        <div class="candidate-title" id="candidateTitle">找到多筆符合資料，請選擇：</div>
        <div id="candidateContainer"></div>
    </div>

    <!-- 圖片顯示區 -->
    <div class="img-container" id="imgContainer">
        <img id="resultImg" src="" alt="圖表載入中..." onerror="handleImageError()">
        <br>
        <a id="downloadBtn" href="" download class="download-btn">下載此圖表</a>
    </div>
</div>

<script>
    let companyMap = {};

    // 頁面載入時，自動抓取對應的 companies.json 對照表
    fetch('./companies.json')
        .then(response => {
            if (!response.ok) {
                throw new Error("無法讀取 companies.json 檔案");
            }
            return response.json();
        })
        .then(data => {
            companyMap = data;
            console.log("對照表已成功載入，共計 " + Object.keys(companyMap).length + " 筆公司資料");
        })
        .catch(err => {
            console.warn("對照表載入提示:", err.message);
        });

    function searchPhoto() {
        const rawInput = document.getElementById("searchInput").value.trim();
        const errorMsg = document.getElementById("errorMsg");
        const imgContainer = document.getElementById("imgContainer");
        const candidateList = document.getElementById("candidateList");

        // 搜尋前先清理舊的狀態
        errorMsg.style.display = "none";
        imgContainer.style.display = "none";
        candidateList.style.display = "none";

        if (!rawInput) {
            errorMsg.innerText = "請輸入搜尋內容！";
            errorMsg.style.display = "block";
            return;
        }

        // 自動去除 .TW 或 .TWO 後綴字
        let cleanInput = rawInput.replace(/\.(TW|TWO)$/i, '');

        // 判斷 1：如果輸入的是純數字 (1 ~ 4 位數)
        if (/^\d{1,4}$/.test(cleanInput)) {
            const targetCode = cleanInput.padStart(4, '0');
            displayImage(targetCode);
        } 
        // 判斷 2：輸入的是中文/英文公司名稱
        else {
            const keyword = rawInput.toLowerCase();
            
            // 搜尋所有公司名稱中「包含」關鍵字的公司項目
            const matches = Object.keys(companyMap).filter(key => 
                key.toLowerCase().includes(keyword)
            );

            if (matches.length === 0) {
                errorMsg.innerText = `找不到與「${rawInput}」相關的公司名稱！`;
                errorMsg.style.display = "block";
            } 
            // 情況 A：剛好只有 1 家公司符合 ➔ 直接顯示圖片，不用點選
            else if (matches.length === 1) {
                const targetCode = companyMap[matches[0]];
                displayImage(targetCode);
            } 
            // 情況 B：有 2 家以上的公司符合（如輸入「積電」找到「台積電」與「力積電」） ➔ 顯示點擊清單
            else {
                showCandidateMenu(matches, rawInput);
            }
        }
    }

    // 顯示圖表
    function displayImage(code) {
        const imgContainer = document.getElementById("imgContainer");
        const resultImg = document.getElementById("resultImg");
        const downloadBtn = document.getElementById("downloadBtn");
        const candidateList = document.getElementById("candidateList");

        candidateList.style.display = "none"; // 點選圖片後，隱藏選單
        
        const imgUrl = `./${code}.png`;

        resultImg.src = imgUrl;
        imgContainer.style.display = "block";

        downloadBtn.href = imgUrl;
        downloadBtn.download = `${code}.png`;
    }

    // 建立多筆結果選單
    function showCandidateMenu(matches, keyword) {
        const candidateList = document.getElementById("candidateList");
        const candidateContainer = document.getElementById("candidateContainer");
        const candidateTitle = document.getElementById("candidateTitle");

        candidateTitle.innerText = `找到 ${matches.length} 筆與「${keyword}」相關的公司：`;
        candidateContainer.innerHTML = "";

        matches.forEach(compName => {
            const code = companyMap[compName];
            
            const item = document.createElement("div");
            item.className = "candidate-item";
            item.innerHTML = `
                <span class="candidate-name">${compName}</span>
                <span class="candidate-code">${code}</span>
            `;
            
            // 點擊對應選項後開啟圖表
            item.onclick = function() {
                displayImage(code);
            };

            candidateContainer.appendChild(item);
        });

        candidateList.style.display = "block";
    }

    // 圖片載入失敗時的處理
    function handleImageError() {
        const errorMsg = document.getElementById("errorMsg");
        const imgContainer = document.getElementById("imgContainer");
        
        imgContainer.style.display = "none";
        errorMsg.innerText = "找不到對應的圖表檔案（請確認是否有該代碼的 PNG 圖檔）！";
        errorMsg.style.display = "block";
    }

    // 支援 Enter 鍵搜尋
    document.getElementById("searchInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            searchPhoto();
        }
    });
</script>

</body>
</html>
