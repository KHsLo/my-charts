<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖表快速查詢</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f6f8;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 520px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.3rem;
        }
        .input-group {
            margin: 15px 0;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #007aff;
        }
        /* 主查詢按鈕組 */
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .search-btn {
            flex: 1;
            padding: 12px;
            font-size: 1.05rem;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-daily {
            background-color: #007aff;
        }
        .btn-daily:hover {
            background-color: #0056b3;
        }
        .btn-weekly {
            background-color: #5856d6;
        }
        .btn-weekly:hover {
            background-color: #3b3a9e;
        }
        /* 候選公司清單樣式 */
        .candidate-list {
            margin-top: 15px;
            display: none;
            text-align: left;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 12px;
        }
        .candidate-title {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
        }
        .candidate-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            margin-bottom: 8px;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            gap: 8px;
        }
        .candidate-item:last-child {
            margin-bottom: 0;
        }
        .candidate-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            overflow: hidden;
        }
        .candidate-name {
            font-weight: bold;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .candidate-code {
            font-size: 0.8rem;
            color: #007aff;
            background: #e7f3ff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .candidate-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .action-btn {
            padding: 6px 10px;
            font-size: 0.85rem;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .action-btn:hover {
            opacity: 0.85;
        }
        .action-daily {
            background-color: #007aff;
        }
        .action-weekly {
            background-color: #5856d6;
        }
        /* 圖片顯示區與上方控制工具列 */
        .img-container {
            margin-top: 20px;
            display: none;
        }
        .image-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .toggle-group {
            display: flex;
            gap: 6px;
        }
        .toggle-btn {
            padding: 6px 12px;
            font-size: 0.85rem;
            border: 1px solid #ced4da;
            border-radius: 6px;
            background-color: #f8f9fa;
            color: #495057;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-btn.active-daily {
            background-color: #007aff;
            color: white;
            border-color: #007aff;
        }
        .toggle-btn.active-weekly {
            background-color: #5856d6;
            color: white;
            border-color: #5856d6;
        }
        .reset-btn {
            padding: 6px 12px;
            font-size: 0.85rem;
            border: none;
            border-radius: 6px;
            background-color: #ff3b30;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .reset-btn:hover {
            background-color: #d70015;
        }
        .chart-tag {
            display: inline-block;
            margin-bottom: 10px;
            padding: 4px 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 20px;
            background-color: #e9ecef;
            color: #333;
        }
        .img-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .error-msg {
            color: #d9534f;
            margin-top: 15px;
            display: none;
            font-size: 0.95rem;
        }
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #34c759;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .download-btn:hover {
            background-color: #28a745;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>圖表快速查詢</h2>
    <div class="input-group">
        <input type="text" id="searchInput" placeholder="請輸入公司代碼或名稱 (例: 鮮活 或 2330)" autocomplete="off">
    </div>
    
    <div class="btn-group">
        <button class="search-btn btn-daily" onclick="searchPhoto('daily')">查看日圖</button>
        <button class="search-btn btn-weekly" onclick="searchPhoto('weekly')">查看週圖</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <!-- 多家公司符合時顯示的候選選單區 -->
    <div class="candidate-list" id="candidateList">
        <div class="candidate-title" id="candidateTitle">找到多筆符合資料，請選擇：</div>
        <div id="candidateContainer"></div>
    </div>

    <!-- 圖片顯示區 -->
    <div class="img-container" id="imgContainer">
        <!-- 圖片上方的快速控制列 -->
        <div class="image-toolbar">
            <div class="toggle-group">
                <button class="toggle-btn" id="toggleDailyBtn" onclick="switchChartType('daily')">日圖</button>
                <button class="toggle-btn" id="toggleWeeklyBtn" onclick="switchChartType('weekly')">週圖</button>
            </div>
            <button class="reset-btn" onclick="resetSearch()">重新查詢</button>
        </div>

        <div class="chart-tag" id="chartTag"></div>
        <br>
        <img id="resultImg" src="" alt="圖表載入中..." onerror="handleImageError()">
        <br>
        <a id="downloadBtn" href="" download class="download-btn">下載此圖表</a>
    </div>
</div>

<script>
    let companyMap = {};
    let currentCode = '';      // 當前選定的公司代碼
    let currentName = '';      // 當前選定的公司名稱
    let currentType = 'daily'; // 當前顯示類別 ('daily' 或 'weekly')

    // 頁面載入時，自動抓取 companies.json 對照表
    fetch('./companies.json')
        .then(response => {
            if (!response.ok) {
                throw new Error("無法讀取 companies.json 檔案");
            }
            return response.json();
        })
        .then(data => {
            companyMap = data;
            console.log("對照表已載入，共計 " + Object.keys(companyMap).length + " 筆公司資料");
        })
        .catch(err => {
            console.warn("對照表載入提示:", err.message);
        });

    function searchPhoto(type = 'daily') {
        const rawInput = document.getElementById("searchInput").value.trim();
        const errorMsg = document.getElementById("errorMsg");
        const imgContainer = document.getElementById("imgContainer");
        const candidateList = document.getElementById("candidateList");

        errorMsg.style.display = "none";
        imgContainer.style.display = "none";
        candidateList.style.display = "none";

        if (!rawInput) {
            errorMsg.innerText = "請輸入搜尋內容！";
            errorMsg.style.display = "block";
            return;
        }

        // 自動去除 .TW 或 .TWO 後綴字
        let cleanInput = rawInput.replace(/\.(TW|TWO)$/i, '');

        // 判斷 1：如果輸入的是純數字 (1 ~ 4 位數)
        if (/^\d{1,4}$/.test(cleanInput)) {
            const targetCode = cleanInput.padStart(4, '0');
            displayImage(targetCode, type, `代碼 ${targetCode}`);
        } 
        // 判斷 2：如果輸入的是公司名稱
        else {
            const keyword = rawInput.toLowerCase();
            const matches = Object.keys(companyMap).filter(key => 
                key.toLowerCase().includes(keyword)
            );

            if (matches.length === 0) {
                errorMsg.innerText = `找不到與「${rawInput}」相關的公司名稱！`;
                errorMsg.style.display = "block";
            } 
            // 情況 A：剛好只有 1 家公司符合 ➔ 直接依類別顯示圖表
            else if (matches.length === 1) {
                const compName = matches[0];
                const targetCode = companyMap[compName];
                displayImage(targetCode, type, compName);
            } 
            // 情況 B：有 2 家以上的公司符合 ➔ 彈出候選清單
            else {
                showCandidateMenu(matches, rawInput);
            }
        }
    }

    // 顯示圖片核心函式
    function displayImage(code, type, compName) {
        currentCode = code;
        currentName = compName;
        currentType = type;

        const imgContainer = document.getElementById("imgContainer");
        const resultImg = document.getElementById("resultImg");
        const downloadBtn = document.getElementById("downloadBtn");
        const candidateList = document.getElementById("candidateList");
        const chartTag = document.getElementById("chartTag");

        candidateList.style.display = "none";
        
        // 更新上方 toggle 按鈕的高亮狀態
        updateToggleStyle(type);

        const folder = (type === 'weekly') ? 'weekly' : 'daily';
        const typeText = (type === 'weekly') ? '週圖' : '日圖';
        
        const imgUrl = `./${folder}/${code}.png`;

        chartTag.innerText = `${compName} (${code}) - ${typeText}`;
        resultImg.src = imgUrl;
        imgContainer.style.display = "block";

        downloadBtn.href = imgUrl;
        downloadBtn.download = `${code}_${folder}.png`;
    }

    // 圖片上方專用的快速切換日/週圖
    function switchChartType(type) {
        if (currentCode) {
            displayImage(currentCode, type, currentName);
        }
    }

    // 更新日/週圖按鈕的高亮外觀
    function updateToggleStyle(type) {
        const toggleDailyBtn = document.getElementById("toggleDailyBtn");
        const toggleWeeklyBtn = document.getElementById("toggleWeeklyBtn");

        toggleDailyBtn.className = "toggle-btn";
        toggleWeeklyBtn.className = "toggle-btn";

        if (type === 'daily') {
            toggleDailyBtn.classList.add("active-daily");
        } else {
            toggleWeeklyBtn.classList.add("active-weekly");
        }
    }

    // 重新查詢（清空）
    function resetSearch() {
        const searchInput = document.getElementById("searchInput");
        const imgContainer = document.getElementById("imgContainer");
        const candidateList = document.getElementById("candidateList");
        const errorMsg = document.getElementById("errorMsg");

        searchInput.value = "";
        imgContainer.style.display = "none";
        candidateList.style.display = "none";
        errorMsg.style.display = "none";

        currentCode = '';
        currentName = '';

        searchInput.focus(); // 自動將游標移回輸入框
    }

    // 建立候選清單
    function showCandidateMenu(matches, keyword) {
        const candidateList = document.getElementById("candidateList");
        const candidateContainer = document.getElementById("candidateContainer");
        const candidateTitle = document.getElementById("candidateTitle");

        candidateTitle.innerText = `找到 ${matches.length} 筆與「${keyword}」相關的公司：`;
        candidateContainer.innerHTML = "";

        matches.forEach(compName => {
            const code = companyMap[compName];
            
            const item = document.createElement("div");
            item.className = "candidate-item";
            item.innerHTML = `
                <div class="candidate-info">
                    <span class="candidate-name" title="${compName}">${compName}</span>
                    <span class="candidate-code">${code}</span>
                </div>
                <div class="candidate-actions">
                    <button class="action-btn action-daily">日圖</button>
                    <button class="action-btn action-weekly">週圖</button>
                </div>
            `;
            
            item.querySelector('.action-daily').onclick = function() {
                displayImage(code, 'daily', compName);
            };

            item.querySelector('.action-weekly').onclick = function() {
                displayImage(code, 'weekly', compName);
            };

            candidateContainer.appendChild(item);
        });

        candidateList.style.display = "block";
    }

    // 圖片載入失敗處理
    function handleImageError() {
        const errorMsg = document.getElementById("errorMsg");
        const imgContainer = document.getElementById("imgContainer");
        
        imgContainer.style.display = "none";
        errorMsg.innerText = "找不到對應的圖表檔案（請確認該類別資料夾內是否有對應 PNG）！";
        errorMsg.style.display = "block";
    }

    // 按 Enter 預設進行日圖查詢
    document.getElementById("searchInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            searchPhoto('daily');
        }
    });
</script>

</body>
</html>
